<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: oklch(0.98 0.002 90); }
  </style>
</helmet>
<div style="display:flex; min-height:100vh; font-family: Helvetica, Arial, sans-serif; color: oklch(0.22 0.005 90);">
  <aside style="width:240px; flex-shrink:0; border-right:1px solid oklch(0.9 0.002 90); padding:32px 20px; display:flex; flex-direction:column; gap:4px;">
    <div style="font-size:15px; font-weight:600; letter-spacing:-0.01em; margin-bottom:24px;">Design System</div>
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="3">
      <button style="text-align:left; border:none; background:{{ s.bg }}; color:{{ s.color }}; font-size:14px; padding:9px 12px; border-radius:6px; cursor:pointer; font-family:inherit;" onClick="{{ s.onClick }}">{{ s.label }}</button>
    </sc-for>
  </aside>
  <main style="flex:1; padding:56px 64px; display:flex; flex-direction:column; align-items:center;">
    <div style="width:100%; max-width:720px;">
      <h1 style="font-size:28px; font-weight:600; letter-spacing:-0.01em; margin:0 0 8px;">{{ active.label }}</h1>
      <div style="height:1px; background:oklch(0.9 0.002 90); margin:20px 0 40px;"></div>

      <sc-if value="{{ isTypography }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:48px;">
          <sc-for list="{{ typeGroups }}" as="group" hint-placeholder-count="5">
            <div style="display:flex; flex-direction:column; gap:20px;">
              <div style="font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:oklch(0.55 0.005 90);">{{ group.title }}</div>
              <sc-for list="{{ group.items }}" as="item" hint-placeholder-count="3">
                <div style="display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:16px 0; border-bottom:1px solid oklch(0.93 0.002 90);">
                  <div style="font-family:{{ item.fontFamily }}; font-weight:{{ item.weight }}; font-size:{{ item.size }}px; line-height:{{ item.lineHeight }}px; color:oklch(0.15 0.005 90);">{{ item.name }}</div>
                  <div style="flex-shrink:0; font-family:'SF Mono', Menlo, monospace; font-size:12px; color:oklch(0.55 0.005 90);">{{ item.spec }}</div>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ true }}">
        <div style="border:1px dashed oklch(0.85 0.002 90); border-radius:10px; padding:64px 24px; text-align:center; color:oklch(0.55 0.005 90); font-size:14px;">
          Раздел пока не заполнен — пришлите набросок из Figma для «{{ active.label }}»
        </div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const FONT = "Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif";
const W = { Regular: 400, Medium: 500, Bold: 700, 'Extra Bold': 800, Black: 900 };

function group(title, size, lineHeight, weights, nameFn) {
  return {
    title,
    items: weights.map(w => ({
      fontFamily: FONT,
      weight: W[w],
      size,
      lineHeight,
      name: nameFn ? nameFn(w) : `${title} / ${size} / ${lineHeight} / ${w}`,
      spec: `${size} / ${lineHeight} / ${W[w]}`
    }))
  };
}

const TYPE_GROUPS = [
  { title: 'Display 48', size: 48, lineHeight: 56, items: [{ weight: 700, name: 'Display / 48 / 56 / Bold' }] },
  { title: 'Display 40', size: 40, lineHeight: 48, items: [{ weight: 700, name: 'Display / 40 / 48 / Bold' }] },
  { title: 'Display 38', size: 38, lineHeight: 46, items: [
    { weight: 700, name: 'Display / 38 / 46 / Bold' },
    { weight: 800, name: 'Display / 38 / 46 / Extra Bold' }
  ] },
  { title: 'Display 30', size: 30, lineHeight: 38, items: [
    { weight: 400, name: 'Display / 30 / 38 / Regular' },
    { weight: 700, name: 'Display / 30 / 38 / Bold' },
    { weight: 900, name: 'Display / 30 / 38 / Black' }
  ] },
  { title: 'Heading 24', size: 24, lineHeight: 32, items: [
    { weight: 400, name: 'Heading / 24 / 32 / Regular' },
    { weight: 500, name: 'Heading / 24 / 32 / Medium' },
    { weight: 700, name: 'Heading / 24 / 32 / Bold' },
    { weight: 900, name: 'Heading / 24 / 32 / Black' }
  ] },
  { title: 'Heading 20', size: 20, lineHeight: 28, items: [
    { weight: 400, name: 'Heading / 20 / 28 / Regular' },
    { weight: 500, name: 'Heading / 20 / 28 / Medium' },
    { weight: 700, name: 'Heading / 20 / 28 / Bold' },
    { weight: 900, name: 'Heading / 20 / 28 / Black' }
  ] },
  { title: 'Heading 19', size: 19, lineHeight: 28, items: [
    { weight: 400, name: 'Heading / 19 / 28 / Regular' },
    { weight: 500, name: 'Heading / 19 / 28 / Medium' },
    { weight: 700, name: 'Heading / 19 / 28 / Bold' },
    { weight: 900, name: 'Heading / 19 / 28 / Black' }
  ] },
  { title: 'Subheading 16', size: 16, lineHeight: 24, items: [
    { weight: 400, name: 'Subheading / 16 / 24 / Regular' },
    { weight: 500, name: 'Subheading / 16 / 24 / Medium' },
    { weight: 700, name: 'Subheading / 16 / 24 / Bold' },
    { weight: 900, name: 'Subheading / 16 / 24 / Black' }
  ] },
  { title: 'Body 14', size: 14, lineHeight: 22, items: [
    { weight: 400, name: 'Body / 14 / 22 / Regular' },
    { weight: 500, name: 'Body / 14 / 22 / Medium' },
    { weight: 700, name: 'Body / 14 / 22 / Bold' }
  ] },
  { title: 'Body 12', size: 12, lineHeight: 20, items: [
    { weight: 400, name: 'Body / 12 / 20 / Regular' },
    { weight: 500, name: 'Body / 12 / 20 / Medium' },
    { weight: 700, name: 'Body / 12 / 20 / Bold' }
  ] },
  { title: 'Body 12 Tight', size: 12, lineHeight: 17, items: [
    { weight: 400, name: 'Body / 12 / 17 / Tight Regular' },
    { weight: 500, name: 'Body / 12 / 17 / Tight Medium' },
    { weight: 700, name: 'Body / 12 / 17 / Tight Bold' }
  ] },
  { title: 'Caption 11', size: 11, lineHeight: 16, items: [
    { weight: 400, name: 'Caption / 11 / 16 / Regular' },
    { weight: 500, name: 'Caption / 11 / 16 / Medium' },
    { weight: 700, name: 'Caption / 11 / 16 / Bold' }
  ] },
  { title: 'Caption 10', size: 10, lineHeight: 13, items: [
    { weight: 400, name: 'Caption / 10 / 13 / Regular' },
    { weight: 500, name: 'Caption / 10 / 13 / Medium' },
    { weight: 700, name: 'Caption / 10 / 13 / Bold' }
  ] }
].map(g => ({
  title: g.title,
  items: g.items.map(it => ({
    fontFamily: FONT,
    weight: it.weight,
    size: g.size,
    lineHeight: g.lineHeight,
    name: it.name,
    spec: `${g.size} / ${g.lineHeight} / ${it.weight}`
  }))
}));

class Component extends DCLogic {
  state = { active: 'typography' };
  labels = { typography: 'Типографика', buttons: 'Кнопки', inputs: 'Инпуты' };
  renderVals() {
    const keys = Object.keys(this.labels);
    const sections = keys.map(k => ({
      key: k,
      label: this.labels[k],
      onClick: () => this.setState({ active: k }),
      bg: this.state.active === k ? 'oklch(0.94 0.003 90)' : 'transparent',
      color: this.state.active === k ? 'oklch(0.18 0.005 90)' : 'oklch(0.4 0.005 90)'
    }));
    return {
      sections,
      active: { label: this.labels[this.state.active] },
      isTypography: this.state.active === 'typography',
      isEmpty: this.state.active !== 'typography',
      typeGroups: TYPE_GROUPS
    };
  }
}
</script>
</body>
</html>
